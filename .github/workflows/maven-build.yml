# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  packages: write
  security-events: write

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17' ]

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{matrix.java}}
      uses: actions/setup-java@v4
      with:
        java-version: ${{matrix.java}}
        distribution: 'adopt'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Publish test report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Maven Tests
        path: '**/target/surefire-reports/*.xml'
        reporter: java-junit

  build-scan-push:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: nkechiogbuji
      SERVICES: "admin-server api-gateway config-server customers-service discovery-server genai-service vets-service visits-service"

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'adopt'
        cache: maven

    - name: Build jars and local Docker images
      run: ./mvnw -B clean install -P buildDocker -DskipTests

    - name: Install Trivy
      uses: aquasecurity/setup-trivy@v0.3.1

    - name: Scan each image with Trivy (report-only)
      run: |
        mkdir -p trivy-results
        for service in $SERVICES; do
          trivy image \
            --format sarif \
            --output "trivy-results/${service}.sarif" \
            "${IMAGE_NAMESPACE}/spring-petclinic-${service}:latest"
        done

    - name: Upload Trivy results for config-server
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results/config-server.sarif
        category: trivy-config-server

    - name: Upload Trivy results for discovery-server
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results/discovery-server.sarif
        category: trivy-discovery-server

    - name: Upload Trivy results for customers-service
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results/customers-service.sarif
        category: trivy-customers-service

    - name: Upload Trivy results for visits-service
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results/visits-service.sarif
        category: trivy-visits-service

    - name: Upload Trivy results for vets-service
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results/vets-service.sarif
        category: trivy-vets-service

    - name: Upload Trivy results for api-gateway
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results/api-gateway.sarif
        category: trivy-api-gateway

    - name: Upload Trivy results for admin-server
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results/admin-server.sarif
        category: trivy-admin-server

    - name: Upload Trivy results for genai-service
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results/genai-service.sarif
        category: trivy-genai-service

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Tag and push images to GHCR
      run: |
        for service in $SERVICES; do
          local_tag="${IMAGE_NAMESPACE}/spring-petclinic-${service}:latest"
          docker tag "$local_tag" "${REGISTRY}/${IMAGE_NAMESPACE}/spring-petclinic-${service}:latest"
          docker tag "$local_tag" "${REGISTRY}/${IMAGE_NAMESPACE}/spring-petclinic-${service}:${{ github.sha }}"
          docker push "${REGISTRY}/${IMAGE_NAMESPACE}/spring-petclinic-${service}:latest"
          docker push "${REGISTRY}/${IMAGE_NAMESPACE}/spring-petclinic-${service}:${{ github.sha }}"
        done
