apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-service
  namespace: petclinic
  labels:
    app.kubernetes.io/name: genai-service
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/component: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: genai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: genai-service
        app.kubernetes.io/part-of: petclinic
        app.kubernetes.io/component: ai
    spec:
      containers:
        - name: genai-service
          image: ghcr.io/nkechiogbuji/spring-petclinic-genai-service:latest
          imagePullPolicy: IfNotPresent
          env:
            # Same reasoning as every other service: the image's baked-in
            # "docker" profile hardcodes these to Docker Compose hostnames,
            # so override explicitly with in-cluster Service DNS names.
            - name: SPRING_CONFIG_IMPORT
              value: configserver:http://config-server.petclinic.svc.cluster.local:8888
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-server.petclinic.svc.cluster.local:8761/eureka/
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          # genai-service consistently needed slightly more than the standard
          # 360s startup budget on this contended kind/WSL node (observed
          # dying mid-Eureka-registration at the 360s mark on repeated
          # attempts); bumped to 540s (periodSeconds 10 x failureThreshold 54)
          # for this service only.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 54
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
