apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-server
  namespace: petclinic
  labels:
    app.kubernetes.io/name: admin-server
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/component: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-server
        app.kubernetes.io/part-of: petclinic
        app.kubernetes.io/component: admin
    spec:
      containers:
        - name: admin-server
          image: ghcr.io/nkechiogbuji/spring-petclinic-admin-server:latest
          imagePullPolicy: IfNotPresent
          env:
            # Same reasoning as every other service: the image's baked-in
            # "docker" profile hardcodes these to Docker Compose hostnames,
            # so override explicitly with in-cluster Service DNS names.
            - name: SPRING_CONFIG_IMPORT
              value: configserver:http://config-server.petclinic.svc.cluster.local:8888
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-server.petclinic.svc.cluster.local:8761/eureka/
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          # Same JVM/Eureka-client startup profile as the other services on
          # this contended kind/WSL node; use the same 360s startup budget
          # (periodSeconds 10 x failureThreshold 36) proven for
          # customers-service/api-gateway.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
