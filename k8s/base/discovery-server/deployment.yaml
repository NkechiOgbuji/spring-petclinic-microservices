apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: petclinic
  labels:
    app.kubernetes.io/name: discovery-server
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/component: discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: discovery-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discovery-server
        app.kubernetes.io/part-of: petclinic
        app.kubernetes.io/component: discovery
    spec:
      containers:
        - name: discovery-server
          image: ghcr.io/nkechiogbuji/spring-petclinic-discovery-server:latest
          imagePullPolicy: IfNotPresent
          env:
            # The image's baked-in "docker" profile hardcodes
            # spring.config.import to the Docker Compose hostname
            # "config-server". Override it explicitly with the in-cluster
            # Service DNS name so this doesn't rely on that name coincidentally
            # matching our Kubernetes Service.
            - name: SPRING_CONFIG_IMPORT
              value: configserver:http://config-server.petclinic.svc.cluster.local:8888
          ports:
            - name: http
              containerPort: 8761
              protocol: TCP
          # Eureka server + client startup, plus fetching config from
          # config-server, is slower than a plain HTTP handshake. The
          # original 200s budget (periodSeconds 5 x failureThreshold 40)
          # proved too tight on this contended kind/WSL node -- observed
          # repeatedly killing the container right around that mark, in the
          # same way vets-service's original 360s budget did (that one
          # needed ~461s to actually finish starting). Widen to the same
          # 600s budget used for vets-service for headroom.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
